name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release with the APK"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Pushes supersede each other; a manually started release build is never cancelled by a push.
  group: android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  APK_NAME: NovaGalerie.apk

jobs:
  build:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using signing key from repository secrets."
          else
            # No secrets configured: create a throw-away key so the APK is still installable.
            # Updates over an older install then require an uninstall first (see android/README.md).
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass novagalerie -keypass novagalerie \
              -alias nova -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Nova Galerie CI, O=Johnny2103, C=CH" >/dev/null 2>&1
            echo "KEYSTORE_PASSWORD=novagalerie" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=nova" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=novagalerie" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_* secrets found – APK signed with a temporary key."
          fi
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PappVersionName="$APP_VERSION" -PappVersionCode="${{ github.run_number }}"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -la "$APK_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGalerie-${{ env.APP_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION }}
          name: Nova Galerie ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ env.APK_NAME }}
          body: |
            Nova Galerie ${{ env.APP_VERSION }} – automatisch gebaut aus `${{ github.ref_name }}` (`${{ github.sha }}`).

            **Installation:** `NovaGalerie.apk` herunterladen, öffnen und die Installation aus unbekannten Quellen erlauben.
            Dauerhafter Download-Link: https://github.com/${{ github.repository }}/releases/latest/download/NovaGalerie.apk
