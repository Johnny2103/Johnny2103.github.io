name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release with the APK"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Pushes supersede each other; a manually started release build is never cancelled by a push.
  group: android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  APK_NAME: NovaGalerie.apk

jobs:
  build:
    name: Build & release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using signing key from repository secrets."
          else
            # No secrets configured: create a throw-away key so the APK is still installable.
            # Updates over an older install then require an uninstall first (see android/README.md).
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass novagalerie -keypass novagalerie \
              -alias nova -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Nova Galerie CI, O=Johnny2103, C=CH" >/dev/null 2>&1
            echo "KEYSTORE_PASSWORD=novagalerie" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=nova" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=novagalerie" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_* secrets found – APK signed with a temporary key."
          fi
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PappVersionName="$APP_VERSION" -PappVersionCode="${{ github.run_number }}"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          ls -la "$APK_NAME"

      - name: Verify the APK has no network permission
        shell: bash
        run: |
          # Privacy check on the final, merged APK: fail the build if any network permission slipped in.
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          echo "Permissions declared by $APK_NAME:"
          "$AAPT2" dump permissions "$APK_NAME" | tee permissions.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)" permissions.txt; then
            echo "::error::The APK requests a network permission – the app must stay offline."
            exit 1
          fi
          echo "OK: no network permission, the app cannot open any connection."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaGalerie-${{ env.APP_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Check token permissions
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A 403 here means the workflow token has no "contents: write" permission
          # (Settings → Actions → General → Workflow permissions → "Read and write permissions").
          gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="app-v${APP_VERSION}" \
            -f target_commitish="${{ github.sha }}" --jq '.name' \
            && echo "Token can access the releases API."

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${APP_VERSION}"
          NOTES="Nova Galerie ${APP_VERSION} – automatisch gebaut aus \`${{ github.ref_name }}\` (\`${{ github.sha }}\`).

          **Installation:** \`NovaGalerie.apk\` herunterladen, öffnen und die Installation aus unbekannten Quellen erlauben.
          Dauerhafter Download-Link: https://github.com/${{ github.repository }}/releases/latest/download/NovaGalerie.apk"
          gh release create "$TAG" "$APK_NAME" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Nova Galerie ${APP_VERSION}" \
            --notes "$NOTES" \
            --latest
