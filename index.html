<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Wirtschaftlichkeits-Analyse Pro</title>

  <!-- Charts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" crossorigin="anonymous"></script>

  <style>
    :root{--primary:#0f766e;--primary-dark:#134e4a;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--bg:#f8fafc;--bg2:#fff;--head:#f1f5f9;--total:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .toolbar{position:sticky;top:0;z-index:10;background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between}
    .btn{border:1px solid var(--border);background:var(--bg2);padding:.5rem .75rem;border-radius:.5rem;cursor:pointer}
    .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .container{max-width:1200px;margin:0 auto;padding:1rem}
    .page{background:var(--bg2);border:1px solid var(--border);border-radius:.75rem;padding:1.5rem;margin-bottom:1.5rem}
    .page-title{margin:.25rem 0 1rem 0;color:var(--primary)}
    .input-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;background:#f6f7fb;border:1px solid var(--border);border-radius:.5rem;padding:1rem}
    .input-group{display:flex;flex-direction:column;gap:.25rem}
    .input-group input{padding:.6rem;border:1px solid var(--border);border-radius:.375rem}
    .section-title{margin:1.5rem 0 .5rem 0;border-bottom:2px solid var(--primary);padding-bottom:.25rem;color:var(--primary)}
    .table-container{overflow:hidden;border:1px solid var(--border);border-radius:.75rem;margin-bottom:1rem}
    table{width:100%;border-collapse:collapse;font-size:.93rem}
    th{background:var(--head);text-align:left;padding:.7rem .6rem}
    td{border-top:1px solid var(--border);padding:.5rem .6rem;vertical-align:middle}
    tfoot td{background:var(--total);font-weight:700}
    .numeric{text-align:right;font-variant-numeric:tabular-nums}
    .table-input{width:100%;border:none;background:transparent;padding:.35rem}
    .table-input.readonly{color:#4b5563}
    .calculated{background:linear-gradient(90deg,transparent,rgba(15,118,110,.08))}
    .sidebar{background:var(--bg2);border:1px solid var(--border);border-radius:.75rem;padding:1rem}
    .grid{display:grid;grid-template-columns:1fr 340px;gap:1rem}
    @media (max-width:1024px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div style="display:flex;gap:.5rem;align-items:center">
      <button class="btn" onclick="printAll()">🖨️ Drucken</button>
      <!-- Excel-Button und -Funktion entfernt -->
      <button class="btn btn-primary" onclick="addNewPage()">➕ Neue Seite</button>
    </div>
    <div id="status" style="color:#64748b">Bereit</div>
  </div>

  <div class="container">
    <div class="grid">
      <div id="pages-container"></div>

      <aside class="sidebar">
        <h3 style="margin-top:0">📊 Übersicht</h3>
        <div>Gesamtkosten: <strong id="totalCostAll">0 CHF</strong></div>
        <div>Günstigste Variante: <strong id="cheapestVariant">-</strong></div>
        <div style="margin-top:1rem">
          <canvas id="costChart" height="220"></canvas>
          <div style="font-size:.85rem;color:#64748b;margin-top:.25rem">
            Diagramm: gestapelte Balken (Kapital, Betrieb, Energie) je Variante
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ========= Settings / State =========
    let pageCount = 1;
    const settings = { currency:'CHF', interestRate:4.0, inflation:2.0 };
    let costChart = null;

    // ========= Helpers =========
    function setStatus(t){ const s=document.getElementById('status'); if(!s) return; s.textContent=t; setTimeout(()=>s.textContent='Bereit',1500); }
    function parseNumber(v){ if(typeof v!=='string') return parseFloat(v)||0; return parseFloat(v.replace(/[^\d.-]/g,'').replace(',','.'))||0; }
    function formatCurrency(v){ return new Intl.NumberFormat('de-CH',{style:'currency',currency:settings.currency,minimumFractionDigits:2}).format(Number(v)||0); }

    // ========= Page =========
    function createPageHTML(pageNum){
      return `
      <div class="page" data-page="${pageNum}">
        <h2 class="page-title">Wirtschaftlichkeitsberechnung:  Variante ${pageNum}</h2>

        <div class="input-grid">
          <div class="input-group">
            <label>Nutzungsdauer (Jahre)</label>
            <input id="duration-${pageNum}" type="number" min="1" step="1" value="30" oninput="calculate(${pageNum})">
          </div>
          <div class="input-group">
            <label>Zinssatz i (%)</label>
            <input id="interest-${pageNum}" type="number" step="0.1" value="${settings.interestRate}" oninput="calculate(${pageNum})">
          </div>
          <div class="input-group">
            <label>Preisteigerung f (%/Jahr)</label>
            <input id="inflation-${pageNum}" type="number" step="0.1" value="${settings.inflation}" oninput="calculate(${pageNum})">
          </div>
          <div class="input-group">
            <label>Variante</label>
            <input id="variant-${pageNum}" type="text" placeholder="Bezeichnung" oninput="updateAnalytics()">
          </div>
        </div>

        <!-- 1. Investition -->
        <h3 class="section-title">💰 1. Investition</h3>
        <div class="table-container">
          <table id="invest-table-${pageNum}">
            <thead>
              <tr>
                <th>Anlageteil</th>
                <th class="numeric">Investitionsausgaben</th>
                <th class="numeric">Nutzungsdauer</th>
                <th class="numeric">Annuitätsfaktor</th>
                <th class="numeric">Jährliche Kapitalkosten</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${Array(3).fill().map((_,i)=>`
              <tr>
                <td><input class="table-input" placeholder="z. B. Gerät ${i+1}"></td>
                <td><input class="table-input numeric invest-amount" type="number" step="0.05" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric usage-duration" type="number" step="1" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric annuity-factor calculated readonly" readonly></td>
                <td><input class="table-input numeric annual-capital calculated readonly" readonly></td>
                <td><button class="btn" onclick="deleteRow(this)">🗑️</button></td>
              </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr>
                <td><strong>Total</strong></td><td></td><td></td><td></td>
                <td class="numeric"><input id="capital-total-${pageNum}" class="table-input numeric calculated readonly" readonly></td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>

        <!-- 2. Betrieb -->
        <h3 class="section-title">🔧 2. Jährliche Betriebskosten</h3>
        <div class="table-container">
          <table id="operating-table-${pageNum}">
            <thead><tr><th>Posten</th><th class="numeric">Aufwand</th><th class="numeric">Wartung</th><th class="numeric">Jährliche Betriebskosten</th><th></th></tr></thead>
            <tbody>
              ${Array(2).fill().map(()=>`
              <tr>
                <td><input class="table-input" placeholder="z. B. Service"></td>
                <td><input class="table-input numeric expense" type="number" step="0.05" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric maintenance" type="number" step="0.05" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric operating-cost calculated readonly" readonly></td>
                <td><button class="btn" onclick="deleteRow(this)">🗑️</button></td>
              </tr>`).join('')}
            </tbody>
            <tfoot><tr><td><strong>Total</strong></td><td></td><td></td><td><input id="operating-total-${pageNum}" class="table-input numeric calculated readonly" readonly></td><td></td></tr></tfoot>
          </table>
        </div>

        <!-- 3. Energie -->
        <h3 class="section-title">⚡ 3. Jährliche Energiekosten</h3>
        <div class="table-container">
          <table id="energy-table-${pageNum}">
            <thead><tr><th>Energieträger</th><th class="numeric">Grundgebühr/Jahr</th><th class="numeric">Verbrauch</th><th class="numeric">Spezifische Kosten</th><th class="numeric">Jährliche Energiekosten</th><th></th></tr></thead>
            <tbody>
              ${Array(2).fill().map(()=>`
              <tr>
                <td><input class="table-input" placeholder="z. B. Strom"></td>
                <td><input class="table-input numeric base-fee" type="number" step="0.05" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric consumption" type="number" step="0.01" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric specific-cost" type="number" step="0.0001" oninput="calculate(${pageNum})"></td>
                <td><input class="table-input numeric energy-cost calculated readonly" readonly></td>
                <td><button class="btn" onclick="deleteRow(this)">🗑️</button></td>
              </tr>`).join('')}
            </tbody>
            <tfoot><tr><td><strong>Total</strong></td><td></td><td></td><td></td><td><input id="energy-total-${pageNum}" class="table-input numeric calculated readonly" readonly></td><td></td></tr></tfoot>
          </table>
        </div>

        <!-- 4. Zusammenfassung -->
        <h3 class="section-title">📊 4. Total der mittleren jährlichen Kosten</h3>
        <div class="table-container">
          <table id="summary-table-${pageNum}">
            <thead><tr><th>Faktor</th><th class="numeric">Mittelwertfaktor</th><th class="numeric">Jährliche Kosten</th><th class="numeric">Mittl. jährliche Kosten</th><th class="numeric">Anteil %</th></tr></thead>
            <tbody>
              <tr>
                <td>💰 Kapitalkosten</td>
                <td><input class="table-input numeric mean-factor calculated readonly" readonly></td>
                <td><input id="annual-capital-${pageNum}" class="table-input numeric readonly calculated" readonly></td>
                <td><input class="table-input numeric mean-cost calculated readonly" readonly></td>
                <td><input class="table-input numeric percentage calculated readonly" readonly></td>
              </tr>
              <tr>
                <td>🔧 Betriebskosten</td>
                <td><input class="table-input numeric mean-factor calculated readonly" readonly></td>
                <td><input id="annual-operating-${pageNum}" class="table-input numeric readonly calculated" readonly></td>
                <td><input class="table-input numeric mean-cost calculated readonly" readonly></td>
                <td><input class="table-input numeric percentage calculated readonly" readonly></td>
              </tr>
              <tr>
                <td>⚡ Energiekosten</td>
                <td><input class="table-input numeric mean-factor calculated readonly" readonly></td>
                <td><input id="annual-energy-${pageNum}" class="table-input numeric readonly calculated" readonly></td>
                <td><input class="table-input numeric mean-cost calculated readonly" readonly></td>
                <td><input class="table-input numeric percentage calculated readonly" readonly></td>
              </tr>
            </tbody>
            <tfoot><tr><td><strong>Gesamttotal</strong></td><td></td><td></td><td><input id="grand-total-${pageNum}" class="table-input numeric calculated readonly" readonly></td><td><strong>100%</strong></td></tr></tfoot>
          </table>
        </div>

        <!-- 5. Faktoren-Übersicht -->
        <h3 class="section-title">🧮 5. Faktoren-Übersicht</h3>
        <div class="table-container">
          <table id="factors-table-${pageNum}">
            <thead>
              <tr>
                <th>Kategorie</th>
                <th>Element</th>
                <th class="numeric">Faktor</th>
              </tr>
            </thead>
            <tbody>
              <!-- wird durch calculate() befüllt -->
            </tbody>
          </table>
        </div>
      </div>`;
    }

    // ========= Calculation =========
    function calculate(pageNum){
      if (!document.getElementById(`invest-table-${pageNum}`)) return;

      const interestRate   = parseNumber(document.getElementById(`interest-${pageNum}`)?.value)  || settings.interestRate;
      const inflationRate  = parseNumber(document.getElementById(`inflation-${pageNum}`)?.value) || settings.inflation;
      const projectDuration= parseNumber(document.getElementById(`duration-${pageNum}`)?.value)  || 20;

      // --- 1) Investition (CRF auf 3 Nachkommastellen) ---
      const investRows = document.querySelectorAll(`#invest-table-${pageNum} tbody tr`);
      let capitalTotal = 0;
      investRows.forEach(row=>{
        const amount        = parseNumber(row.querySelector('.invest-amount')?.value)   || 0;
        const usageDuration = parseNumber(row.querySelector('.usage-duration')?.value)  || projectDuration;
        const i = interestRate/100, n = usageDuration;

        let crfRaw = 0;
        if (i>0 && n>0) crfRaw = i * Math.pow(1+i,n) / (Math.pow(1+i,n) - 1);
        else if (n>0)   crfRaw = 1/n;
        const crfRounded = crfRaw ? Math.round(crfRaw*1000)/1000 : 0;

        row.querySelector('.annuity-factor').value = crfRounded ? crfRounded.toFixed(3) : '';
        const annual = amount * crfRounded;
        row.querySelector('.annual-capital').value = annual ? annual.toFixed(2) : '';
        if (annual) capitalTotal += annual;
      });
      document.getElementById(`capital-total-${pageNum}`).value = capitalTotal ? capitalTotal.toFixed(2) : '';

      // --- 2) Betrieb ---
      const opRows = document.querySelectorAll(`#operating-table-${pageNum} tbody tr`);
      let operatingTotal = 0;
      opRows.forEach(row=>{
        const a = parseNumber(row.querySelector('.expense')?.value)     || 0;
        const b = parseNumber(row.querySelector('.maintenance')?.value) || 0;
        const val = a + b;
        row.querySelector('.operating-cost').value = val ? val.toFixed(2) : '';
        if (val) operatingTotal += val;
      });
      document.getElementById(`operating-total-${pageNum}`).value = operatingTotal ? operatingTotal.toFixed(2) : '';

      // --- 3) Energie ---
      const enRows = document.querySelectorAll(`#energy-table-${pageNum} tbody tr`);
      let energyTotal = 0;
      enRows.forEach(row=>{
        const fee   = parseNumber(row.querySelector('.base-fee')?.value)      || 0;
        const cons  = parseNumber(row.querySelector('.consumption')?.value)   || 0;
        const spec  = parseNumber(row.querySelector('.specific-cost')?.value) || 0;
        const val = fee + cons * spec;
        row.querySelector('.energy-cost').value = val ? val.toFixed(2) : '';
        if (val) energyTotal += val;
      });
      document.getElementById(`energy-total-${pageNum}`).value = energyTotal ? energyTotal.toFixed(2) : '';

      // --- 4) Summary: Jahreskosten übernehmen ---
      document.getElementById(`annual-capital-${pageNum}`).value   = capitalTotal   ? capitalTotal.toFixed(2)   : '';
      document.getElementById(`annual-operating-${pageNum}`).value = operatingTotal ? operatingTotal.toFixed(2) : '';
      document.getElementById(`annual-energy-${pageNum}`).value    = energyTotal    ? energyTotal.toFixed(2)    : '';

      const totals = [capitalTotal, operatingTotal, energyTotal];

      // Mittelwertfaktor für Betrieb & Energie
      const iEff = (parseNumber(document.getElementById(`interest-${pageNum}`)?.value) || settings.interestRate)/100;
      const f    = (parseNumber(document.getElementById(`inflation-${pageNum}`)?.value) || settings.inflation)/100;
      const n    = projectDuration;

      const crfForMean = (iEff>0 && n>0) ? ( iEff / (1 - Math.pow(1+iEff,-n)) ) : ( n>0 ? 1/n : 0 );
      const r       = (1+f)/(1+iEff);
      const midYear = Math.sqrt(1+iEff);

      let meanFactorOE = 1;
      if (n>0){
        if (Math.abs(r-1) < 1e-9){
          meanFactorOE = crfForMean * n;
        } else {
          meanFactorOE = (crfForMean / midYear) * ((1 - Math.pow(r, n)) / (1 - r));
        }
      }
      const meanFactorRounded = Math.round(meanFactorOE * 1000) / 1000;

      // Zeilen aktualisieren
      const summaryRows = document.querySelectorAll(`#summary-table-${pageNum} tbody tr`);
      let grandTotal = 0;
      summaryRows.forEach((row, idx)=>{
        const factorInput   = row.querySelector('.mean-factor');
        const meanCostInput = row.querySelector('.mean-cost');

        const factor = (idx===0) ? 1 : meanFactorRounded;  // Kapital: 1; Betrieb/Energie: gerundet
        if (factorInput) factorInput.value = factor.toFixed(3);

        const meanCost = (totals[idx] || 0) * factor;
        if (meanCostInput) meanCostInput.value = meanCost ? meanCost.toFixed(2) : '';
        if (meanCost) grandTotal += meanCost;
      });

      const grandEl = document.getElementById(`grand-total-${pageNum}`);
      if (grandEl) grandEl.value = grandTotal ? grandTotal.toFixed(2) : '';

      summaryRows.forEach((row, idx)=>{
        const factor = (idx===0) ? 1 : meanFactorRounded;
        const meanCost = (totals[idx] || 0) * factor;
        const perc = grandTotal>0 ? (meanCost / grandTotal * 100) : 0;
        const pEl = row.querySelector('.percentage');
        if (pEl) pEl.value = perc ? perc.toFixed(1) : '';
      });

      // 5) Faktoren-Übersicht befüllen
      fillFactorsTable(pageNum, meanFactorRounded);

      setStatus('Berechnet');
      updateAnalytics();
    }

    function fillFactorsTable(pageNum, meanFactorRounded){
      const table = document.querySelector(`#factors-table-${pageNum} tbody`);
      if (!table) return;
      table.innerHTML = '';

      // Annuitätsfaktoren (je Anlageteil)
      const investRows = document.querySelectorAll(`#invest-table-${pageNum} tbody tr`);
      investRows.forEach((row, idx)=>{
        const name = row.querySelector('td:first-child input')?.value?.trim() || `Anlageteil ${idx+1}`;
        const af   = row.querySelector('.annuity-factor')?.value;
        if (af){
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>Investition (Annuität)</td><td>${name}</td><td class="numeric">${af}</td>`;
          table.appendChild(tr);
        }
      });

      // Mittelwertfaktor (ein Wert für Betrieb & Energie)
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>Betrieb & Energie (Mittelwert)</td><td>Mittelwertfaktor</td><td class="numeric">${meanFactorRounded.toFixed(3)}</td>`;
      table.appendChild(tr);
    }

    // ========= Analytics (gestapeltes Balkendiagramm) =========
    function updateAnalytics(){
      const pages = document.querySelectorAll('.page');
      let sum = 0, cheapest = {name:'-', cost:Infinity};

      const labels = [];
      const capData = [], opData = [], enData = [];

      pages.forEach(p=>{
        const pageNum = p.dataset.page;
        const name = document.getElementById(`variant-${pageNum}`)?.value || `Variante ${pageNum}`;
        const grand = parseNumber(document.getElementById(`grand-total-${pageNum}`)?.value) || 0;

        const rows = document.querySelectorAll(`#summary-table-${pageNum} tbody tr`);
        const capMean = parseNumber(rows[0]?.querySelector('.mean-cost')?.value) || 0;
        const opMean  = parseNumber(rows[1]?.querySelector('.mean-cost')?.value) || 0;
        const enMean  = parseNumber(rows[2]?.querySelector('.mean-cost')?.value) || 0;

        if (grand>0){
          sum += grand;
          labels.push(name);
          capData.push(capMean);
          opData.push(opMean);
          enData.push(enMean);

          if (grand < cheapest.cost) cheapest = {name, cost:grand};
        }
      });

      document.getElementById('totalCostAll').textContent = formatCurrency(sum);
      document.getElementById('cheapestVariant').textContent = cheapest.cost===Infinity ? '-' : `${cheapest.name} (${formatCurrency(cheapest.cost)})`;

      const ctx = document.getElementById('costChart'); if (!ctx) return;
      if (costChart) costChart.destroy();

      costChart = new Chart(ctx,{
        type:'bar',
        data:{
          labels,
          datasets:[
            {label:'Kapital', data:capData, stack:'kosten'},
            {label:'Betrieb', data:opData,  stack:'kosten'},
            {label:'Energie', data:enData,  stack:'kosten'},
          ]
        },
        options:{
          responsive:true,
          plugins:{ legend:{ position:'bottom' } },
          scales:{
            x:{ stacked:true },
            y:{ stacked:true, ticks:{ callback:(v)=>formatCurrency(v) } }
          }
        }
      });
    }

    // ========= Table helpers =========
    function deleteRow(btn){
      const tr = btn.closest('tr'); const tbody = tr.parentElement;
      if (tbody.querySelectorAll('tr').length>1) tr.remove();
      const pageNum = btn.closest('.page').dataset.page;
      calculate(Number(pageNum));
    }

    // ========= Print =========
    function printAll(){ window.print(); }

    // ========= Boot =========
    function addNewPage(){
      pageCount++;
      document.getElementById('pages-container').insertAdjacentHTML('beforeend', createPageHTML(pageCount));
      calculate(pageCount);
      setStatus('Neue Seite');
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      document.getElementById('pages-container').innerHTML = createPageHTML(1);
      calculate(1);
    });
  </script>
</body>
</html>
